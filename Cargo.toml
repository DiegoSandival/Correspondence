[package]
name = "Correspondence"
version = "0.1.0"
edition = "2024"

[lib]
name = "correspondence"
path = "src/lib.rs"

[dependencies]
blake2 = "0.10"
dotenvy = "0.15"
ouroboros_db = { git = "https://github.com/DiegoSandival/ouroboros.git" }
rand = "0.8"
redb = "2"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
