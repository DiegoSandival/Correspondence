[package]
name = "correspondence"
version = "0.1.0"
edition = "2024"

[dependencies]
ouroboros = { git = "https://github.com/DiegoSandival/ouroboros", branch = "minimal" }
redb = "4"
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
